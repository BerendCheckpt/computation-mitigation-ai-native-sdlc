# Baseline measurement for templates/minimal-api-endpoint (run with scripts/measure-baseline.cs).
# Both arms get the same prompt, the same fresh scaffold and the same acceptance commands; only the availability of
# the cnu-aico MCP server differs. The acceptance commands define what "the same result" means — keep them strict
# enough that a run cannot pass by doing less than the template does.
template: minimal-api-endpoint
prompt: >-
  Add a minimal API endpoint group for entity Order in project Shop.Api: list, get by id, create and delete, where
  create rejects an empty name. Put storage behind an interface with a thread-safe in-memory implementation, wire it
  up in Program.cs, and add xUnit unit tests for the handlers in tests/Shop.Api.Tests. Everything must build and the
  tests must pass.
runs: 5
model: claude-sonnet-5-5
maxTurns: 40
timeoutMinutes: 20
scaffold:
  - dotnet new web -n Shop.Api -o src/Shop.Api
  - dotnet new xunit -n Shop.Api.Tests -o tests/Shop.Api.Tests
  - rm -f tests/Shop.Api.Tests/UnitTest1.cs
  - dotnet add tests/Shop.Api.Tests reference src/Shop.Api
acceptance:
  - dotnet build src/Shop.Api
  # At least 4 real tests must exist and pass (the scaffold's placeholder test was removed).
  - test "$(dotnet test tests/Shop.Api.Tests --list-tests 2>/dev/null | grep -c '^    ')" -ge 4
  - dotnet test tests/Shop.Api.Tests
