# Stage 4/5 — deterministic verification of template output, and the gate for AI review.
# Required status check. If every changed file regenerates identically from a crystallized template,
# the PR is "template-only" and needs no AI review: re-generate + diff replaces a model call.
# Otherwise AI review happens locally, in an agent sandbox started from the hub (no model runs in this workflow).
name: template-verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      template_only: ${{ steps.verify.outputs.template_only }}
    env:
      CNU_AICO_LOG: .aico/decisions-${{ github.run_id }}.jsonl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - id: verify
        name: Regenerate and diff template output
        run: dotnet run scripts/aico-ci.cs -- verify --base origin/${{ github.base_ref }}
      - name: AI review route (summary)
        env:
          TEMPLATE_ONLY: ${{ steps.verify.outputs.template_only }}
        run: |
          {
            echo "### AI review"
            if [ "$TEMPLATE_ONLY" = "true" ]; then
              echo "Template-only PR (\`template_only=true\`): every changed file regenerates identically, so no AI review is needed."
            else
              echo "Not template-only: AI review happens locally, in an agent sandbox started from the hub, following \`REVIEW.md\`."
              echo "No model runs in this workflow."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aico-decisions-${{ github.run_id }}
          path: .aico/
          if-no-files-found: ignore
          retention-days: 30
