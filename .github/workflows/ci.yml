# Stage 4 — Test. Fully deterministic: no model is invoked here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build (warnings are errors)
        run: dotnet build Cnu.AICO.slnx -c Release
      - name: Test (unit, golden files, routing evals, MCP end-to-end)
        run: dotnet test Cnu.AICO.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Validate template specs
        run: dotnet run scripts/aico-ci.cs -- validate
      - name: Token ledger overview is up to date
        run: dotnet run scripts/aico-ci.cs -- ledger check
      - name: Template self-test (generated code + shipped tests compile and pass)
        run: bash scripts/template-selftest.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  sandbox-kit:
    # The agent sandbox kit (sbx v3 mixin). The descriptor starts with `# syntax=docker/sandbox-kit:3`, so BuildKit
    # builds it with that frontend. Build only: nothing is pushed (sbx builds the local kit directory itself).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the aico-dotnet kit (no push)
        run: docker buildx build -f sandbox/aico-dotnet/aico-dotnet.yaml sandbox/aico-dotnet

  hub-aot:
    # Native AOT publish of the local hub, so a broken AOT build shows up here before hub-release.
    # Needs clang and zlib1g-dev, which ubuntu-latest provides.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish aico-hub (Native AOT, linux-x64)
        run: dotnet publish scripts/aico-hub.cs -r linux-x64 -o out/hub
