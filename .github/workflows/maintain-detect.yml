# Stage 6 — Maintain. Deterministic detection decides WHETHER something is wrong. No model runs in this workflow
# (ops/bands.md):
#   1σ log · 2σ anomaly issue filed (no model) · 3σ the same issue, also labelled agent-fix-allowed.
# Model work (diagnosis, a fix PR through review) happens locally: an engineer starts an agent from the hub.
# Metrics flagged critical never get autonomous fixes (policy.yaml: critical → human).
name: maintain-detect

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      band: ${{ steps.detect.outputs.band }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Collect metric (CI failure rate per day) — deterministic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow ci.yml --branch main --limit 500 --json conclusion,createdAt > runs.json
          jq '[group_by(.createdAt[0:10])[] | {day: .[0].createdAt[0:10], rate: (([.[] | select(.conclusion=="failure")] | length) / length)}] | sort_by(.day)' runs.json > daily.json
          jq '[.[:-1][].rate]' daily.json > history.json
          jq '.[-1].rate // 0' daily.json > current.txt
      - id: detect
        name: Band (mean/σ, no model)
        run: |
          out=$(dotnet run scripts/aico-ci.cs -- detect --metric ci_failure_rate --history history.json --current "$(cat current.txt)")
          echo "$out"
          echo "$out" > detection.json
          {
            echo "### Detection"
            echo '```json'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: File the anomaly issue (2σ diagnose, 3σ act) — deterministic
        if: steps.detect.outputs.band == 'diagnose' || steps.detect.outputs.band == 'act'
        env:
          GH_TOKEN: ${{ github.token }}
          BAND: ${{ steps.detect.outputs.band }}
          METRIC: ci_failure_rate
          # ci_failure_rate is not a critical metric (ops/bands.md). A critical metric (e.g. post_deploy_5xx_rate)
          # would set CRITICAL: "true": its issue gets the `critical` label instead of `agent-fix-allowed`, so the
          # hub shows no Plan button and the policy routes the work to a human.
          CRITICAL: "false"
        run: |
          case "$BAND" in diagnose) sigma="≥2σ" ;; act) sigma="≥3σ" ;; esac
          title="anomaly: $METRIC at band $BAND ($sigma)"
          # One open issue per metric and band: skip if it is already filed.
          existing=$(gh issue list --state open --label "stage:maintain" --limit 200 --json title \
                       --jq "[.[] | select(.title == \"$title\")] | length")
          if [ "$existing" != "0" ]; then
            echo "An open issue \"$title\" already exists; not filing a duplicate." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          labels="stage:maintain"
          if [ "$CRITICAL" = "true" ]; then
            labels="$labels,critical"
          elif [ "$BAND" = "act" ]; then
            labels="$labels,agent-fix-allowed"
          fi
          {
            echo "### Detection"
            echo
            echo '```json'
            cat detection.json
            echo '```'
            echo
            echo "Filed by \`maintain-detect\` (run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). No model was invoked."
            echo
            echo "### Diagnosis (intent draft)"
            echo "Next: start a local agent from the hub (**Plan** on this issue) to diagnose read-only (\`incident-diagnoser\`)."
            if [ "$BAND" = "act" ] && [ "$CRITICAL" != "true" ]; then
              echo "At band act the agent may then write a failing test first and open a fix PR through review, or name a runbook in \`ops/runbooks/\`."
            fi
            echo
            echo "### Triage decision"
            echo "untriaged"
          } > body.md
          gh issue create --title "$title" --label "$labels" --body-file body.md
