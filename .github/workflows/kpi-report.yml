# Weekly mitigation KPI report from the decision logs. Deterministic: no model.
# Token usage comes from ledger fragments that local agent sessions commit under ledger/fragments/ with their PRs.
name: kpi-report

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download decision logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .aico
          # 14 days overlaps the previous report.
          since=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          for id in $(gh run list --limit 500 --json databaseId,createdAt \
                        --jq ".[] | select(.createdAt >= \"$since\") | .databaseId"); do
            gh run download "$id" --pattern 'aico-decisions-*' --dir ".aico/$id" 2>/dev/null || true
          done
      - name: Merge into the token ledger (deterministic runs are compared with their baselines here)
        run: |
          # Ledger merges are idempotent (entries are keyed by id); a missing ledger/fragments/ merges nothing.
          dotnet run scripts/aico-ci.cs -- ledger merge --from ledger/fragments
          dotnet run scripts/aico-ci.cs -- ledger report
      - name: Build report
        env:
          # Configurable estimate; publish the factor you use. Not a measurement.
          CNU_AICO_KWH_PER_MTOK: "0.4"
          CNU_AICO_G_CO2_PER_KWH: "300"
        run: dotnet run scripts/aico-ci.cs -- kpi --logs .aico --out "reports/kpi-$(date -u +%G-W%V).md"
      - name: Open PR with the report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          week=$(date -u +%G-W%V)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "kpi/$week"
          # Merged fragments are now in ledger/token-usage.jsonl; remove them so they don't pile up.
          git rm -q --ignore-unmatch 'ledger/fragments/*.jsonl'
          git add reports/ ledger/
          git commit -m "kpi: weekly report and token ledger $week" || exit 0
          git push -u origin "kpi/$week"
          gh pr create --title "kpi: $week" --body "Weekly KPI report and token-ledger merge (deterministic, no model). Review new ledger entries in the diff of ledger/token-usage.jsonl; the overview is reports/token-ledger.md. Merged fragments are removed from ledger/fragments/." --label kpi
