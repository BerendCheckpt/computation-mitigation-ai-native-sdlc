# Stage 2 — Design. A merged intent.md triggers the requirements-and-design pass.
# Deterministic first: a crystallized template that covers the intent is referenced, not re-specified.
name: stage-2-spec

on:
  push:
    branches: [main]
    paths: ["work/**/intent.md"]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  spec:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - id: changed
        name: Which intents were accepted?
        run: |
          files=$(git diff --name-only HEAD~1 HEAD -- 'work/**/intent.md' | tr '\n' ' ')
          # Skip intents that already have a spec (e.g. an intent edit after design started).
          todo=""; for f in $files; do [ -f "$(dirname "$f")/spec.md" ] || todo="$todo $f"; done
          echo "todo=${todo# }" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.todo != ''
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            Accepted intents: ${{ steps.changed.outputs.todo }}

            For each intent, use the write-spec skill (with the security-policy skill as a constraint) and open one PR
            per spec titled "spec: <slug>" with label stage:spec. Request review from the CODEOWNERS of spec.md.
          # Design is the one stage that gets the most capable model (ADR 0004).
          claude_args: |
            --model claude-opus-5-5
            --max-turns 40
            --mcp-config '{"mcpServers":{"cnu-aico":{"type":"stdio","command":"dotnet","args":["run","--project","src/Cnu.AICO.McpServer","--"],"env":{"CNU_AICO_CONTEXT":"build"}}}}'
            --allowedTools Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh pr create:*),mcp__cnu-aico__match_template,ReadMcpResourceTool
