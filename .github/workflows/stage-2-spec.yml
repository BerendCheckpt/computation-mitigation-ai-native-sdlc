# Stage 2 — Design. A merged intent.md starts the requirements-and-design pass. Design is done by a local agent in
# its own Docker Sandbox, started by an engineer from the hub, so this workflow uses NO model: it only opens a
# tracking issue. Deterministic first: a crystallized template that covers the intent is referenced, not re-specified.
name: stage-2-spec

on:
  push:
    branches: [main]
    paths: ["work/**/intent.md"]

permissions:
  contents: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Open a "spec" issue per accepted intent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for intent in $(git diff --name-only HEAD~1 HEAD -- 'work/**/intent.md'); do
            dir=$(dirname "$intent")
            # Skip intents that already have a spec (e.g. an intent edit after design started).
            [ -f "$dir/spec.md" ] && continue
            {
              echo "Intent accepted: \`$intent\`."
              echo
              echo "Next: start a local agent from the hub (**Plan** on this issue). It runs in its own sandbox in **plan mode**"
              echo "and uses the \`write-spec\` skill (with the \`security-policy\` skill as a constraint) to write \`$dir/spec.md\`."
              echo "Open the PR \"spec: $(basename "$dir")\" with label \`stage:spec\`; the CODEOWNERS of \`spec.md\` approve it."
              echo "Crystallized templates that cover the intent are referenced through the \`cnu-aico\` MCP tools, not re-specified."
            } > body.md
            gh issue create --title "spec: $(basename "$dir")" --label "stage:spec" --body-file body.md
          done
