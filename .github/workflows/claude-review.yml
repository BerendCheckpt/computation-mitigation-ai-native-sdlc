# Stage 5 — AI in the PR review loop. Reusable workflow, called by template-verify.yml only when the PR is NOT
# template-only. @claude mentions in PR comments are handled by claude-on-demand.yml.
# Keep this file workflow_call-only: a called workflow may not request more permissions than its caller
# (template-verify grants contents: read), or GitHub refuses to start the caller at all.
# (Alternatively enable the managed Claude Code Review GitHub integration.)
name: claude-review

on:
  workflow_call:
    inputs:
      pr_number:
        type: number
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ inputs.pr_number }}

            Review this pull request following REVIEW.md exactly (severity order: Blocker, Major, Minor, Nit).
            - Skip files whose first line contains `aico:generated`: they were regenerated and verified deterministically
              by template-verify; list them once as "verified, not reviewed".
            - Check the diff against the committed plan.md under work/ if one is referenced.
            - Post inline comments for Blocker/Major only; one summary comment for the rest.
            - If a hand-written pattern looks like an existing template in templates/, say which one.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 15
            --allowedTools Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment
