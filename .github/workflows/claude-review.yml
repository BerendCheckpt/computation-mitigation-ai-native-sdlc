# Stage 5 — AI in the PR review loop. Called by template-verify.yml only when the PR is NOT template-only,
# and on demand when someone mentions @claude in a PR comment.
# (Alternatively enable the managed Claude Code Review GitHub integration and keep this file for @claude only.)
name: claude-review

on:
  workflow_call:
    inputs:
      pr_number:
        type: number
        required: true
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    # Runs only when called from template-verify.yml (inputs.pr_number is set only for workflow_call).
    if: inputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ inputs.pr_number }}

            Review this pull request following REVIEW.md exactly (severity order: Blocker, Major, Minor, Nit).
            - Skip files whose first line contains `aico:generated`: they were regenerated and verified deterministically
              by template-verify; list them once as "verified, not reviewed".
            - Check the diff against the committed plan.md under work/ if one is referenced.
            - Post inline comments for Blocker/Major only; one summary comment for the rest.
            - If a hand-written pattern looks like an existing template in templates/, say which one.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 15
            --allowedTools Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment

  on-demand:
    # @claude in a PR comment: answer/fix on request (humans steer).
    if: >
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 30
            --mcp-config .mcp.json
